name: Merge LTS One Shot

on:
  workflow_dispatch:
    inputs:
      base_tag:
        default: 'v5.10.236'
      upstream_tag:
        default: 'v5.10.272'

env:
  DEC_B64: ""
  PY_B64: ""

jobs:
  one:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: n2f-272

      - name: run
        run: |
          set +e
          exec > >(tee -a run.log) 2>&1
          git config user.email ci@local
          git config user.name ci
          TREE=$(git rev-parse HEAD^{tree})
          echo "vendor tree $TREE"
          git remote add upstream https://github.com/gregkh/linux.git
          git fetch --no-tags upstream "refs/tags/${{ inputs.base_tag }}:refs/tags/${{ inputs.base_tag }}" "refs/tags/${{ inputs.upstream_tag }}:refs/tags/${{ inputs.upstream_tag }}"
          echo "fetch rc=$?"

          git checkout -B lts-final "${{ inputs.base_tag }}"
          git read-tree "$TREE"
          git commit -q -m "vendor snapshot on ${{ inputs.base_tag }}"
          git reset --hard HEAD
          git clean -fdq

          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff "${{ inputs.upstream_tag }}" > merge.log 2>&1
          echo "merge rc=$?"
          echo "raw conflicts: $(git ls-files -u | cut -f2 | sort -u | wc -l)"

          echo "$DEC_B64" | base64 -d > decisions.tsv
          echo "$PY_B64" | base64 -d > apply_block.py
          echo "decisions lines: $(wc -l < decisions.tsv)"

          python3 apply_block.py > blk.log 2>&1
          echo "apply rc=$?"
          tail -5 blk.log

          for f in $(git ls-files -u | cut -f2 | sort -u); do
            if [ -f "$f" ] && ! grep -qE '^(<<<<<<< |>>>>>>> )' "$f"; then
              git add -- "$f"
            fi
          done
          git ls-files -u | cut -f2 | sort -u > unresolved.txt
          N=$(wc -l < unresolved.txt)
          echo "REMAINING=$N"
          cat unresolved.txt

          if [ "$N" -eq 0 ]; then
            git add -A
            git commit -m "merge: Linux 5.10.272 into OPPO mt6983 (base 236, 96 block decisions)"
            echo "commit rc=$?"
            git branch -f lts-272 HEAD
            git push -f origin lts-272
            echo "push rc=$?"
            git log -1 --format='%H %s'
            git diff --shortstat HEAD~1 HEAD
          else
            echo "skip commit"
          fi

      - name: publish
        if: always()
        run: |
          mkdir -p /tmp/res
          for f in run.log merge.log blk.log decisions.tsv unresolved.txt; do [ -f "$f" ] && cp "$f" /tmp/res/; done
          cd /tmp/res
          git init -q .
          git config user.email ci@local
          git config user.name ci
          git add -A
          git commit -q -m "oneshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-final
