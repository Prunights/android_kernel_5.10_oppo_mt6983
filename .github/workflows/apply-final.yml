name: Apply Final Resolution

on:
  workflow_dispatch:
    inputs:
      target:
        default: 'n2f-272'
      base_tag:
        default: 'v5.10.236'
      upstream_tag:
        default: 'v5.10.272'

env:
  DEC_B64: ""
  THEIRS_B64: ""
  OURS_B64: "ZHJpdmVycy9iYXNlL3BsYXRmb3JtLmMKCmRyaXZlcnMvZmlybXdhcmUvZWZpL21va3Zhci10YWJsZS5jCgpkcml2ZXJzL3VzYi9ob3N0L3hoY2ktcmluZy5jCgpmcy9mMmZzL2YyZnMuaAoKZnMvZnMtd3JpdGViYWNrLmMKCmluY2x1ZGUvbmV0L2luZXRfY29ubmVjdGlvbl9zb2NrLmgKCm5ldC9pcHY0L3N5c2N0bF9uZXRfaXB2NC5jCgo="
  PY_B64: ""

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: vendor tree
        id: v
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> $GITHUB_OUTPUT

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/gregkh/linux.git || true
          git fetch --no-tags upstream "refs/tags/${{ inputs.base_tag }}:refs/tags/${{ inputs.base_tag }}" "refs/tags/${{ inputs.upstream_tag }}:refs/tags/${{ inputs.upstream_tag }}"

      - name: fabricate base and merge
        run: |
          git config user.email ci@local
          git config user.name ci
          git checkout -B lts-final "${{ inputs.base_tag }}"
          git read-tree "${{ steps.v.outputs.tree }}"
          git commit -q -m "vendor snapshot on ${{ inputs.base_tag }}"
          git reset --hard HEAD && git clean -fdq
          set +e
          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff "${{ inputs.upstream_tag }}" > merge.log 2>&1
          set -e
          git checkout --conflict=diff3 -- . 2>/dev/null || true
          echo "initial conflicts: $(git diff --name-only --diff-filter=U | wc -l)"

      - name: write payloads
        run: |
          echo "$DEC_B64" | base64 -d > decisions.tsv
          echo "$THEIRS_B64" | base64 -d > theirs.txt
          echo "$OURS_B64" | base64 -d > ours.txt
          echo "$PY_B64" | base64 -d > apply_block.py
          sed -i '/^[[:space:]]*$/d' theirs.txt ours.txt
          echo "decisions: $(($(wc -l < decisions.tsv)-1)), theirs: $(wc -l < theirs.txt), ours: $(wc -l < ours.txt)"
          head -2 decisions.tsv
          python3 -c "print('py ok', len(open('apply_block.py').read()))"

      - name: apply whole-file policy
        run: |
          xargs -a theirs.txt git checkout --theirs -- 2>/dev/null || true
          xargs -a theirs.txt git add -- 2>/dev/null || true
          xargs -a ours.txt git checkout --ours -- 2>/dev/null || true
          xargs -a ours.txt git add -- 2>/dev/null || true
          echo "after whole-file: $(git diff --name-only --diff-filter=U | wc -l)"

      - name: apply block decisions
        run: |
          python3 apply_block.py
          git diff --name-only --diff-filter=U | sort > unresolved.txt || true
          echo "=== remaining ==="
          wc -l < unresolved.txt
          cat unresolved.txt

      - name: commit if zero
        run: |
          N=$(git diff --name-only --diff-filter=U | wc -l)
          echo "remaining=$N"
          if [ "$N" -eq 0 ]; then
            git add -A
            git commit -q -m "merge: Linux 5.10.272 into OPPO mt6983 vendor tree (base 236, 78 block decisions)"
            git branch -f lts-272 HEAD
            git push -f origin lts-272
            echo "PUSHED lts-272"
            git log -1 --format="%H %s"
            git diff --shortstat HEAD~1 HEAD || true
          else
            echo "not committed"
          fi

      - name: publish
        if: always()
        run: |
          mkdir -p /tmp/res
          for f in unresolved.txt decisions.tsv merge.log; do [ -f "$f" ] && cp "$f" /tmp/res/; done
          cd /tmp/res && git init -q . && git config user.email ci@local && git config user.name ci
          git add -A && git commit -q -m "apply final $(date -u +%FT%TZ)" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-final
